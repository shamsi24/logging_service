name: logging_service
description: >-
  Shake to open network inspector for Flutter and Dio. Search and filter calls,
  copy any request as cURL, with credentials redacted by default.
version: 0.1.0
repository: https://github.com/shamsi24/logging_service
issue_tracker: https://github.com/shamsi24/logging_service/issues

environment:
  sdk: ^3.5.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.0.0
  json_view: ^0.4.2
  dio: ^5.9.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
